<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ImagenAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0f0f0f;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: #a78bfa; }
    p.subtitle { color: #888; margin-bottom: 2rem; }
    .input-row {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 600px;
    }
    input {
      flex: 1;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      font-size: 1rem;
    }
    button {
      padding: 0.8rem 1.5rem;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #6d28d9; }
    button:disabled { background: #444; cursor: not-allowed; }
    #status { margin-top: 1rem; color: #888; font-size: 0.9rem; }
    #result { margin-top: 2rem; }
    #result img {
      max-width: 512px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(124, 58, 237, 0.4);
    }
  </style>
</head>

<div id="history-section" style="margin-top: 3rem; width: 100%; max-width: 900px;">
    <h2 style="color: #a78bfa; margin-bottom: 1rem;">History</h2>
    <div id="history-list" style="display: flex; flex-wrap: wrap; gap: 1rem;"></div>
  </div>
<body>
  <h1>ImagenAI</h1>
  <p class="subtitle">Type a prompt and generate an image with AI</p>

  <div class="input-row">
    <input type="text" id="prompt" placeholder="Describe the image you want to generate..." />
    <button id="btn" onclick="generate()">Generate</button>
  </div>

  <p id="status"></p>
  <div id="result"></div>

  <script>
    async function generate() {
      const prompt = document.getElementById('prompt').value.trim();
      if (!prompt) return;

      const btn = document.getElementById('btn');
      const status = document.getElementById('status');
      const result = document.getElementById('result');

      btn.disabled = true;
      result.innerHTML = '';

      try {
        // Step 1: POST /generate karo
        status.textContent = 'Submitting request...';
        const response = await fetch(`/generate?prompt=${encodeURIComponent(prompt)}`, {
          method: 'POST'
        });
        if (!response.ok) throw new Error('Generation failed');
        const data = await response.json();
        const requestId = data.request_id;

        // Step 2: Polling shuru karo
        status.textContent = 'Generating image...';
        const interval = setInterval(async () => {
          const statusRes = await fetch(`/status/${requestId}`);
          const statusData = await statusRes.json();

          if (statusData.status === 'COMPLETED') {
            clearInterval(interval);
            result.innerHTML = `<img src="/image/${requestId}" alt="Generated image" />`;
            status.textContent = 'Done!';
            btn.disabled = false;
          } else if (statusData.status === 'FAILED') {
            clearInterval(interval);
            status.textContent = 'Error: Image generation failed.';
            btn.disabled = false;
          }
        }, 3000);

      } catch (err) {
        status.textContent = 'Error: ' + err.message;
        btn.disabled = false;
      }
    }

    document.getElementById('prompt').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') generate();
    });

  async function loadHistory() {
      const historyList = document.getElementById('history-list');
      const res = await fetch('/history');
      const data = await res.json();

      if (data.length === 0) {
        historyList.innerHTML = '<p style="color: #888;">No generations yet.</p>';
        return;
      }

      historyList.innerHTML = data.map(item => `
        <div style="background: #1a1a1a; border-radius: 8px; padding: 0.8rem; border: 1px solid #333; width: 200px;">
          <p style="color: #a78bfa; font-size: 0.85rem; margin-bottom: 0.4rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.prompt}</p>
          <p style="color: #888; font-size: 0.75rem; margin-bottom: 0.5rem;">${item.status}</p>
          ${item.status === 'COMPLETED' ? `<img src="/image/${item.request_id}" style="width:100%; border-radius: 6px;" />` : ''}
        </div>
      `).join('');
    }

    loadHistory();
</script>
  
</body>
</html>
