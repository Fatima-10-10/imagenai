<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ImagenAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0f0f0f;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: #a78bfa; }
    p.subtitle { color: #888; margin-bottom: 2rem; }
    .input-row {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 600px;
    }
    input {
      flex: 1;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      font-size: 1rem;
    }
    button {
      padding: 0.8rem 1.5rem;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #6d28d9; }
    button:disabled { background: #444; cursor: not-allowed; }
    #status { margin-top: 1rem; color: #888; font-size: 0.9rem; }
    #result { margin-top: 2rem; }
    #result img {
      max-width: 512px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(124, 58, 237, 0.4);
    }
  </style>
</head>
<body>
  <h1>ImagenAI</h1>
  <p class="subtitle">Type a prompt and generate an image with AI</p>

  <div class="input-row">
    <input type="text" id="prompt" placeholder="Describe the image you want to generate..." />
    <button id="btn" onclick="generate()">Generate</button>
  </div>

  <p id="status"></p>
  <div id="result"></div>

  <script>
    async function generate() {
      const prompt = document.getElementById('prompt').value.trim();
      if (!prompt) return;

      const btn = document.getElementById('btn');
      const status = document.getElementById('status');
      const result = document.getElementById('result');

      btn.disabled = true;
      status.textContent = 'Generating...';
      result.innerHTML = '';

      try {
        const response = await fetch(`/generate?prompt=${encodeURIComponent(prompt)}`);
        if (!response.ok) throw new Error('Generation failed');

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        result.innerHTML = `<img src="${url}" alt="Generated image" />`;
        status.textContent = 'Done!';
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('prompt').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') generate();
    });
  </script>
</body>
</html>
